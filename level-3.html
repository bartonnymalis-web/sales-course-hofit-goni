<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>תורת המכירות · רמה 3 · מומחים · חופית וגוני</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000000;
    --bg-soft:#0a0a0c;
    --panel:#101014;
    --panel-2:#16161c;
    --line:#26262e;
    --pink:#D4006A;
    --white:#ffffff;
    --muted:#9a9aa6;
    --muted-2:#6b6b76;
    --accent:#D4006A; /* נדרס לכל שיעור */
    --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    --sidebar-w:260px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:var(--font);
    direction:rtl;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ===== פריסה ===== */
  .app{display:flex;height:100vh;width:100vw}

  /* ===== סרגל צד ===== */
  .sidebar{
    width:var(--sidebar-w);
    flex:0 0 var(--sidebar-w);
    height:100vh;
    background:linear-gradient(180deg,#0c0c10,#050507);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;
    z-index:40;
    transition:transform .3s ease;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand .logo{display:flex;align-items:center;gap:10px}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--pink);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#fff;font-size:18px;
    box-shadow:0 0 22px rgba(212,0,106,.55);
  }
  .brand .name{font-weight:800;font-size:17px;letter-spacing:.2px}
  .brand .sub{color:var(--muted);font-size:11.5px;margin-top:7px;font-weight:500}

  .nav{flex:1;overflow-y:auto;padding:12px 10px}
  .nav::-webkit-scrollbar{width:7px}
  .nav::-webkit-scrollbar-thumb{background:#222;border-radius:8px}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:11px;cursor:pointer;
    color:var(--muted);font-weight:600;font-size:14px;
    transition:.18s;margin-bottom:3px;
    border:1px solid transparent;
  }
  .nav-item:hover{background:#15151b;color:#fff}
  .nav-item .dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px}
  .nav-item .ni-num{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-right:auto}
  .nav-item.active{
    background:#15151b;color:#fff;
    border-color:color-mix(in srgb,var(--ni,#D4006A) 40%,transparent);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--ni,#D4006A) 18%,transparent) inset;
  }
  .nav-cover{border-bottom:1px dashed var(--line);margin-bottom:8px;padding-bottom:10px}
  .nav-foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted-2);font-size:11px}

  /* ===== מסך ראשי / דק ===== */
  .deck{
    flex:1;height:100vh;overflow-y:scroll;
    scroll-snap-type:y mandatory;scroll-behavior:smooth;
    position:relative;
  }
  .deck::-webkit-scrollbar{width:0}
  .slide{
    min-height:100vh;width:100%;
    scroll-snap-align:start;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:64px clamp(24px,5vw,90px);
    overflow:hidden;
  }
  .slide .glow{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(900px 520px at 78% 18%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 60%);
    opacity:.9;
  }
  .slide .grid-bg{
    position:absolute;inset:0;pointer-events:none;opacity:.25;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 78% 30%,#000,transparent 70%);
    mask-image:radial-gradient(circle at 78% 30%,#000,transparent 70%);
  }

  /* ===== חשיפה באנימציה ===== */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
  .slide.in-view .reveal{opacity:1;transform:none}
  .slide.in-view .reveal.d1{transition-delay:.08s}
  .slide.in-view .reveal.d2{transition-delay:.16s}
  .slide.in-view .reveal.d3{transition-delay:.24s}
  .slide.in-view .reveal.d4{transition-delay:.32s}
  .slide.in-view .reveal.d5{transition-delay:.40s}
  .art-wrap{opacity:0;transform:translateX(-34px) scale(.96);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:.18s}
  .slide.in-view .art-wrap{opacity:1;transform:none}

  /* ===== שקופית פתיח (קאבר) ===== */
  .cover{flex-direction:column;text-align:center;gap:20px}
  .cover .kicker{
    font-family:var(--mono);letter-spacing:3px;font-size:13px;color:var(--pink);
    text-transform:uppercase;font-weight:700;
  }
  .cover h1{
    font-size:clamp(38px,7vw,84px);font-weight:900;line-height:1.02;margin:0;
    background:linear-gradient(180deg,#fff,#cfa6bd);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cover .pinkword{color:var(--pink);-webkit-text-fill-color:var(--pink)}
  .cover .crumb{
    display:inline-flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    color:var(--muted);font-size:clamp(14px,2vw,19px);font-weight:600;margin-top:6px;
  }
  .cover .crumb b{color:#fff}
  .cover .crumb .sep{color:var(--pink);font-weight:800}
  .cover .big-mark{
    width:96px;height:96px;border-radius:24px;background:var(--pink);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:52px;
    box-shadow:0 0 60px rgba(212,0,106,.55);margin-bottom:6px;
  }
  .cover .scroll-hint{
    margin-top:26px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .cover .scroll-hint .chev{width:22px;height:22px;border-right:2px solid var(--pink);border-bottom:2px solid var(--pink);transform:rotate(45deg);animation:bob 1.6s infinite}
  @keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(5px,5px)}}

  /* ===== שקופית פתיח שיעור ===== */
  .lesson-intro{flex-direction:column;text-align:center;gap:8px}
  .lesson-intro .l-num{
    font-family:var(--mono);font-size:clamp(120px,22vw,260px);font-weight:800;line-height:.85;
    color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--accent) 70%,#fff 0%);
    text-shadow:0 0 80px color-mix(in srgb,var(--accent) 45%,transparent);
    letter-spacing:-6px;
  }
  .lesson-intro .l-tag{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:13px;letter-spacing:2px;font-weight:700;
    color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
    padding:7px 16px;border-radius:999px;text-transform:uppercase;
    background:color-mix(in srgb,var(--accent) 8%,transparent);
  }
  .lesson-intro h2{font-size:clamp(34px,6vw,68px);font-weight:900;margin:6px 0 0;line-height:1.05}
  .lesson-intro .l-topics{color:var(--muted);font-size:15px;max-width:640px;margin-top:14px;line-height:1.7}

  /* ===== שקופית נושא ===== */
  .topic{align-items:center}
  .topic-inner{
    width:100%;max-width:1180px;display:grid;grid-template-columns:1.05fr .95fr;
    gap:clamp(28px,5vw,70px);align-items:center;
  }
  .t-text{min-width:0}
  .t-tag{
    display:inline-flex;align-items:center;gap:9px;margin-bottom:18px;
    font-size:12.5px;font-weight:700;color:var(--accent);
    font-family:var(--mono);letter-spacing:.5px;
  }
  .t-tag .pill{
    background:color-mix(in srgb,var(--accent) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    padding:4px 11px;border-radius:999px;
  }
  .share-badge{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    color:#cfcfe0;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;
    margin-bottom:16px;
  }
  .share-badge svg{width:14px;height:14px}
  .t-text h3{
    font-size:clamp(28px,4.4vw,52px);font-weight:900;line-height:1.08;margin:0 0 16px;
    letter-spacing:-.5px;
  }
  .t-text h3 .hl{color:var(--accent)}
  .t-desc{color:#d9d9e3;font-size:clamp(16px,1.7vw,20px);line-height:1.6;font-weight:400;max-width:560px}
  .t-points{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px;max-width:560px}
  .t-points li{
    display:flex;gap:12px;align-items:flex-start;color:#c7c7d2;font-size:15.5px;line-height:1.5;font-weight:500;
  }
  .t-points li .tick{
    flex:0 0 22px;width:22px;height:22px;border-radius:7px;margin-top:1px;
    background:color-mix(in srgb,var(--accent) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
    display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:900;font-size:12px;
  }
  .t-art{display:flex;align-items:center;justify-content:center;min-width:0}

  /* ===== כרטיס איור ===== */
  .art-card{
    width:100%;max-width:460px;aspect-ratio:1/1;border-radius:28px;
    background:radial-gradient(120% 120% at 75% 15%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%),linear-gradient(160deg,#0e0e13,#08080b);
    border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset;
    display:flex;align-items:center;justify-content:center;padding:34px;position:relative;overflow:hidden;
  }
  .art-card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%)}
  .art-card svg{width:100%;height:100%;position:relative;z-index:1;overflow:visible}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .spin-slow{transform-origin:center;animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dash{stroke-dasharray:6 8;animation:march 1.4s linear infinite}
  @keyframes march{to{stroke-dashoffset:-28}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* ===== בלוק העתקה ===== */
  .copy-card{
    margin-top:26px;max-width:560px;background:#0c0c11;border:1px solid var(--line);
    border-radius:16px;overflow:hidden;
  }
  .copy-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 15px;background:#121219;border-bottom:1px solid var(--line);
  }
  .copy-head .ch-label{
    font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:8px;
  }
  .copy-head .ch-label .dotc{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .copy-btn{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    background:color-mix(in srgb,var(--accent) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
    color:#fff;font-family:var(--font);font-weight:700;font-size:12.5px;
    padding:6px 13px;border-radius:9px;transition:.18s;
  }
  .copy-btn:hover{background:color-mix(in srgb,var(--accent) 28%,transparent)}
  .copy-btn.done{background:rgba(22,185,129,.18);border-color:rgba(22,185,129,.55);color:#5af0bf}
  .copy-btn svg{width:14px;height:14px}
  .copy-body{
    padding:16px 18px;font-family:var(--mono);font-size:14.5px;line-height:1.75;color:#e7e7ef;
    direction:rtl;white-space:pre-wrap;
  }

  /* ===== בלוק דוגמאות לשיחה ===== */
  .ex-block{margin-top:22px;max-width:600px}
  .ex-title{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .ex-list{display:flex;flex-direction:column;gap:9px}
  .ex-item{display:flex;align-items:stretch;gap:8px}
  .ex-text{flex:1;background:#0c0c11;border:1px solid var(--line);border-right:3px solid var(--accent);border-radius:11px;padding:11px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.6;color:#e7e7ef;direction:rtl}
  .ex-copy{flex:0 0 auto;align-self:center}

  /* ===== תג שאלה לקהל ===== */
  .discuss-badge{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:#fff;padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:700;margin-bottom:16px}

  /* ===== זיהוי סגנון לקוח ===== */
  .identify{display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px}
  .id-row{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(160deg,color-mix(in srgb,var(--ic) 16%,#0b0b0f),#0a0a0d);border:1px solid color-mix(in srgb,var(--ic) 45%,transparent);border-radius:14px;padding:13px 15px}
  .id-badge{flex:0 0 40px;width:40px;height:40px;border-radius:11px;background:var(--ic);color:#0a0a0d;font-family:var(--mono);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px color-mix(in srgb,var(--ic) 50%,transparent)}
  .id-main{min-width:0;flex:1}
  .id-name{font-weight:800;font-size:15px;color:#fff}
  .id-cue{font-size:13px;color:#c7c7d2;margin-top:2px;line-height:1.45}
  .id-quote{font-family:var(--mono);font-size:12px;color:var(--ic);margin-top:7px;background:rgba(255,255,255,.04);border-radius:8px;padding:6px 10px;line-height:1.5}

  /* ===== DISC ===== */
  .disc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:560px}
  .disc-q .q-mean{font-family:var(--mono);font-size:10.5px;color:var(--qc);font-weight:700;margin:2px 0 5px;letter-spacing:.2px}
  .disc-q{
    border-radius:18px;padding:20px;min-height:150px;position:relative;overflow:hidden;
    border:1px solid color-mix(in srgb,var(--qc) 55%,transparent);
    background:linear-gradient(160deg,color-mix(in srgb,var(--qc) 26%,#0b0b0f),#0a0a0d);
    transition:.25s;
  }
  .disc-q:hover{transform:translateY(-4px);box-shadow:0 18px 40px color-mix(in srgb,var(--qc) 25%,transparent)}
  .disc-q .ql{font-family:var(--mono);font-weight:800;font-size:40px;color:var(--qc);line-height:1}
  .disc-q .qt{font-weight:800;font-size:18px;margin:6px 0 8px}
  .disc-q .qd{color:#c9c9d4;font-size:13.5px;line-height:1.55}
  .disc-q .qbadge{position:absolute;top:16px;left:16px;width:14px;height:14px;border-radius:50%;background:var(--qc);box-shadow:0 0 14px var(--qc)}

  /* ===== סקאלת 5 מצבים ===== */
  .states{display:flex;gap:8px;width:100%;max-width:620px;align-items:stretch}
  .state-step{
    flex:1;border-radius:14px;padding:14px 10px;text-align:center;position:relative;
    background:linear-gradient(160deg,color-mix(in srgb,var(--sc) 22%,#0b0b0f),#0a0a0d);
    border:1px solid color-mix(in srgb,var(--sc) 45%,transparent);
    transition:.3s;
  }
  .state-step .sn{font-family:var(--mono);font-weight:800;font-size:22px;color:var(--sc)}
  .state-step .st{font-size:12px;color:#d3d3dd;margin-top:6px;line-height:1.35;font-weight:600}
  .state-step.hl{transform:translateY(-8px);box-shadow:0 16px 40px color-mix(in srgb,var(--sc) 38%,transparent);border-width:2px}
  .state-arrow{display:flex;align-items:center;color:var(--muted-2);font-size:20px;font-weight:800}

  /* ===== מדרגות 7 רקיעים ===== */
  .stairs{display:flex;align-items:flex-end;gap:6px;width:100%;max-width:600px;height:300px}
  .stair{
    flex:1;border-radius:10px 10px 4px 4px;position:relative;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 60%,transparent),color-mix(in srgb,var(--accent) 18%,transparent));
    border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
    display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
    padding:8px 4px;transition:.3s;
  }
  .stair:hover{filter:brightness(1.25)}
  .stair .sr-ico{font-size:18px}
  .stair .sr-n{font-family:var(--mono);font-weight:800;color:#fff;font-size:13px;margin-top:4px}
  .stair .sr-t{font-size:10px;color:#eee;text-align:center;line-height:1.2;margin-top:4px;font-weight:600;opacity:.92}

  /* ===== אם-אז ===== */
  .ifthen{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px}
  .it-row{
    display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;
  }
  .it-if{
    background:#101017;border:1px solid var(--line);border-radius:13px;padding:14px 15px;cursor:pointer;
    transition:.22s;position:relative;
  }
  .it-if:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .it-if .lab{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:800;margin-bottom:6px;letter-spacing:1px}
  .it-if .txt{font-size:14px;color:#e2e2ea;line-height:1.45;font-weight:600}
  .it-if .hint{font-size:11px;color:var(--muted-2);margin-top:8px;display:flex;align-items:center;gap:5px}
  .it-mid{display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;font-weight:900;opacity:.5;transition:.22s}
  .it-then{
    background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 18%,#0b0b0f),#0a0a0d);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    border-radius:13px;padding:14px 15px;opacity:0;transform:translateX(-14px);
    transition:.3s;display:flex;align-items:center;
  }
  .it-then .lab{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:800;margin-bottom:6px;letter-spacing:1px}
  .it-then .txt{font-size:14px;color:#fff;line-height:1.45;font-weight:600}
  .it-row.open .it-then{opacity:1;transform:none}
  .it-row.open .it-mid{opacity:1;transform:scale(1.15)}
  .it-row.open .it-if{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:#13131b}

  /* ===== פער ויזואלי ===== */
  .gap-art{width:100%;max-width:460px}
  .gap-art svg{width:100%;height:auto;display:block;overflow:visible}

  /* ===== יחס הקשבה ===== */
  .ratio{width:100%;max-width:520px}
  .ratio-bar{display:flex;height:90px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .ratio-client{flex:0 0 70%;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#000),color-mix(in srgb,var(--accent) 40%,#000));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .ratio-you{flex:0 0 30%;background:#15151c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-right:1px solid var(--line)}
  .ratio-pct{font-family:var(--mono);font-weight:800;font-size:34px;color:#fff}
  .ratio-lab{font-size:13px;color:#eee;font-weight:700}
  .ratio-you .ratio-lab{color:var(--muted)}
  .ratio-note{margin-top:16px;color:#c7c7d2;font-size:14px;text-align:center}

  /* ===== כפתורי חצים ===== */
  .arrows{
    position:fixed;bottom:22px;left:24px;display:flex;gap:10px;z-index:50;
  }
  .arrow-btn{
    width:50px;height:50px;border-radius:14px;cursor:pointer;

const deck = document.getElementById("deck");

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

let copyCounter = 0;

function renderCover(){
  const s = el('<section class="slide cover" data-accent="#D4006A"><div class="glow"></div><div class="grid-bg"></div></section>');
  s.style.setProperty("--accent","#D4006A");
  s.insertAdjacentHTML("beforeend", `
    <div class="big-mark reveal">ח</div>
    <div class="kicker reveal d1">${lcfg.kicker}</div>
    <h1 class="reveal d2">ברוכים הבאים<br/>ל<span class="pinkword">תורת המכירות</span></h1>
    <div class="crumb reveal d3"><b>${lcfg.label}</b><span class="sep">|</span><b>${lcfg.sub}</b><span class="sep">|</span><b>חופית וגוני</b></div>
    <div class="scroll-hint reveal d4">גללו למטה כדי להתחיל<div class="chev"></div></div>
  `);
  return s;
}

function renderLessonIntro(li){
  const les = LESSONS[li];
  const s = el('<section class="slide lesson-intro"><div class="glow"></div><div class="grid-bg"></div></section>');
  s.style.setProperty("--accent", les.accent);
  const blurb = les.blurb ? `<div class="l-topics reveal d3">${esc(les.blurb)}</div>` : "";
  s.insertAdjacentHTML("beforeend", `
    <div class="l-tag reveal">שיעור ${les.n}</div>
    <div class="l-num reveal d1">0${les.n}</div>
    <h2 class="reveal d2">${esc(les.title)}</h2>
    ${blurb}
  `);
  return s;
}

function buildArt(les, tp){
  if(tp.special==="disc") return buildDisc();
  if(tp.special==="statesScale") return buildStates(tp.highlight);
  if(tp.special==="stairs") return buildStairs(les.accent);
  if(tp.special==="gap") return buildGap();
  if(tp.special==="ifthen") return buildIfThen(tp.pairs);
  if(tp.special==="ratio") return buildRatio();
  if(tp.special==="identify") return buildIdentify();
  // אייקון רגיל בכרטיס
  return `<div class="art-card">${iconFor(tp.icon)}</div>`;
}

/* ===================== ניווט ולוגיקה ===================== */
const slideNodes = Array.from(deck.querySelectorAll(".slide"));
let total = slideNodes.length;
let current = 0;

const progressBar = document.getElementById("progressBar");
const counter = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function pad(n){ return String(n).padStart(2,"0"); }

function setCurrent(i){
  if(i===current) return;
  current = i;
  updateUI();
}

function updateUI(){
  progressBar.style.width = ((current+1)/total*100)+"%";
  counter.innerHTML = `<b>${pad(current+1)}</b> / ${pad(total)}`;
  prevBtn.disabled = current===0;
  nextBtn.disabled = current===total-1;

  // אקצנט גלובלי לחצים/מד לפי השקופית הנוכחית
  const acc = slideNodes[current].style.getPropertyValue("--accent") || "#D4006A";
  document.documentElement.style.setProperty("--accent", acc);

  // סרגל צד פעיל
  const cur = slides[current];
  let activeLesson = null;
  if(cur.kind==="lessonIntro"||cur.kind==="topic") activeLesson = cur.li;
  document.querySelectorAll(".nav-item").forEach(n=>{
    const l = n.dataset.lesson;
    n.classList.toggle("active", l!==undefined && Number(l)===activeLesson);
  });
}

function goTo(i){
  i = Math.max(0, Math.min(total-1, i));
  slideNodes[i].scrollIntoView({behavior:"smooth"});
  // current יתעדכן ע"י המשקיף; אך נעדכן מיידית לתחושת תגובה
  setCurrent(i);
}

// גילוי שלב-אחר-שלב — מחזיר true אם "אכל" את הקליק
function tryStepReveal(){
  const s = slideNodes[current];
  if(!s || !s.dataset.stepReveal) return false;
  const totalSteps = parseInt(s.dataset.stepReveal);
  const done = parseInt(s.dataset.stepDone||"0");
  if(done >= totalSteps) return false;
  const pt = s.querySelector('.step-point[data-step="'+done+'"]');
  if(pt) pt.classList.add("shown");
  s.dataset.stepDone = done+1;
  // הסתרת הרמז אחרי הקליק הראשון
  const hint = s.querySelector(".step-hint");
  if(hint) hint.style.display = "none";
  return true;
}

// איפוס מצב גילוי בשקופית יעד
function resetStepReveal(idx){
  const s = slideNodes[idx];
  if(!s || !s.dataset.stepReveal) return;
  s.dataset.stepDone = "0";
  s.querySelectorAll(".step-point").forEach(p=>p.classList.remove("shown"));
  const hint = s.querySelector(".step-hint");
  if(hint) hint.style.display = "";
}

prevBtn.addEventListener("click", ()=>{ resetStepReveal(current-1); goTo(current-1); });
nextBtn.addEventListener("click", ()=>{ if(!tryStepReveal()) goTo(current+1); });

// מקלדת — RTL: שמאל = קדימה, ימין = אחורה
document.addEventListener("keydown", (e)=>{
  if(e.key==="ArrowLeft"||e.key==="ArrowDown"||e.key==="PageDown"){ e.preventDefault(); if(!tryStepReveal()) goTo(current+1); }
  else if(e.key==="ArrowRight"||e.key==="ArrowUp"||e.key==="PageUp"){ e.preventDefault(); resetStepReveal(current-1); goTo(current-1); }
  else if(e.key==="Home"){ e.preventDefault(); goTo(0); }
  else if(e.key==="End"){ e.preventDefault(); goTo(total-1); }
});

// משקיף — קובע שקופית פעילה + אנימציות חשיפה
const io = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    const idx = Number(en.target.dataset.index);
    if(en.isIntersecting && en.intersectionRatio>=0.4){
      en.target.classList.add("in-view"); // חשיפת אנימציה — נשארת דלוקה
    }
    if(en.isIntersecting && en.intersectionRatio>=0.55){
      setCurrent(idx);
    }
  });
},{root:deck, threshold:[0.4,0.55,0.75]});
slideNodes.forEach(n=>io.observe(n));
slideNodes[0].classList.add("in-view");

// סרגל צד — לחיצה
navEl.addEventListener("click",(e)=>{
  const item = e.target.closest("[data-go]");
  if(!item) return;
  goTo(Number(item.dataset.go));
  closeSidebar();
});

deck.addEventListener("click",(e)=>{
  const row = e.target.closest(".it-row");
  if(row && row.querySelector(".it-if").contains(e.target)){
    row.classList.toggle("open");
  }
});

// העתקה
deck.addEventListener("click", async (e)=>{
  const btn = e.target.closest(".copy-btn");
  if(!btn) return;
  const id = btn.dataset.copy;
  const body = document.getElementById(id);
  const text = body ? body.textContent : "";
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text); ok=true;
    }
  }catch(err){ ok=false; }
  if(!ok){
    try{
      window.focus();
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.top="0"; ta.style.left="0"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
      ok=document.execCommand("copy"); document.body.removeChild(ta);
    }catch(err){ ok=false; }
  }
  const span = btn.querySelector("span");
  if(ok){
    btn.classList.add("done");
    if(span) span.textContent="הועתק ✓";
    setTimeout(()=>{ btn.classList.remove("done"); if(span) span.textContent="העתק"; }, 1900);
  }else{
    if(span) span.textContent="נסו שוב";
    setTimeout(()=>{ if(span) span.textContent="העתק"; }, 1900);
  }
});
